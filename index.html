    <script>
        // --- Product data loaded from JSON ---
        let productsData = [];
        let activeProductId = null;
        let isAddMode = false;
        let packagingData = [];
        let expandedCategories = new Set();
        let railGroups = [];
        let expandedVarieties = new Set();

        // --- DOM Elements ---
        const productRail = document.getElementById('product-rail');
        
        // --- Render Product Rail（按品类分组、可折叠；特种按品种二级分组） ---
        const SPECIAL_CATEGORY = '特种';

        function railCategoryOf(prod) {
            return (prod.liquidType && prod.liquidType.category) ? prod.liquidType.category : '未分类';
        }

        function railVarietyOf(prod) {
            return (prod.liquidType && prod.liquidType.variety) ? prod.liquidType.variety : '未分类品种';
        }

        function productItemHtml(prod) {
            const isActive = prod.id === activeProductId;
            const itemClass = isActive ? 'bg-primary-container/10 border-primary text-primary font-bold' : 'border-transparent text-on-surface font-medium hover:bg-surface-container-low';
            return `
                <div data-product-id="${prod.id}" class="flex items-center gap-2 px-3 py-2 rounded-lg border-l-2 cursor-pointer transition-all ${itemClass}">
                    <span class="text-sm truncate flex-1">${prod.name}</span>
                </div>
            `;
        }

        function renderRail() {
            // 按「品类」分组，保持首次出现的顺序
            const groups = [];
            const order = {};
            productsData.forEach(prod => {
                const cat = railCategoryOf(prod);
                if (!(cat in order)) { order[cat] = groups.length; groups.push({ category: cat, items: [] }); }
                groups[order[cat]].items.push(prod);
            });

            // 「特种」品类再按「品种」二级分组
            groups.forEach(g => {
                if (g.category === SPECIAL_CATEGORY) {
                    const subs = [];
                    const subOrder = {};
                    g.items.forEach(prod => {
                        const v = railVarietyOf(prod);
                        if (!(v in subOrder)) { subOrder[v] = subs.length; subs.push({ variety: v, items: [] }); }
                        subs[subOrder[v]].items.push(prod);
                    });
                    g.subgroups = subs;
                }
            });
            railGroups = groups;

            // 自动展开当前选中产品所在的品类（特种同时展开其品种）
            if (activeProductId) {
                const active = productsData.find(p => p.id === activeProductId);
                if (active) {
                    const cat = railCategoryOf(active);
                    expandedCategories.add(cat);
                    if (cat === SPECIAL_CATEGORY) expandedVarieties.add(railVarietyOf(active));
                }
            }

            const scrollTop = productRail.scrollTop;
            let html = '';
            groups.forEach((g, gi) => {
                const expanded = expandedCategories.has(g.category);
                const chevClass = expanded ? 'rotate-90 text-primary' : 'text-outline-variant';
                const labelClass = expanded ? 'text-primary' : 'text-on-surface-variant';
                const countClass = expanded ? 'bg-primary/10 text-primary' : 'bg-surface-container text-on-surface-variant';

                let body = '';
                if (g.subgroups) {
                    body = g.subgroups.map((sg, si) => {
                        const vExpanded = expandedVarieties.has(sg.variety);
                        const vChevClass = vExpanded ? 'rotate-90 text-primary' : 'text-outline-variant';
                        const vLabelClass = vExpanded ? 'text-primary' : 'text-on-surface-variant';
                        const vCountClass = vExpanded ? 'bg-primary/10 text-primary' : 'bg-surface-container text-on-surface-variant';
                        return `
                            <div class="flex flex-col">
                                <button type="button" data-var-index="${gi}-${si}" class="w-full flex items-center gap-1.5 px-2 py-1.5 rounded-lg text-left transition-colors hover:bg-surface-container-low">
                                    <span class="material-symbols-outlined text-base transition-transform chev ${vChevClass}">chevron_right</span>
                                    <span class="text-xs font-semibold flex-1 truncate cat-label ${vLabelClass}">${sg.variety}</span>
                                    <span class="text-[10px] font-bold px-1.5 py-0.5 rounded-full cat-count ${vCountClass}">${sg.items.length}</span>
                                </button>
                                <div data-var-items="${gi}-${si}" class="flex flex-col gap-1 pl-3 ml-2 border-l border-outline-variant/40 mt-0.5 mb-1 ${vExpanded ? '' : 'hidden'}">
                                    ${sg.items.map(productItemHtml).join('')}
                                </div>
                            </div>
                        `;
                    }).join('');
                } else {
                    body = g.items.map(productItemHtml).join('');
                }

                html += `
                    <div class="flex flex-col">
                        <button type="button" data-cat-index="${gi}" class="w-full flex items-center gap-1.5 px-2 py-2 rounded-lg text-left transition-colors hover:bg-surface-container-low">
                            <span class="material-symbols-outlined text-base transition-transform chev ${chevClass}">chevron_right</span>
                            <span class="text-xs font-bold uppercase tracking-wide flex-1 truncate cat-label ${labelClass}">${g.category}</span>
                            <span class="text-[10px] font-bold px-1.5 py-0.5 rounded-full cat-count ${countClass}">${g.items.length}</span>
                        </button>
                        <div data-cat-items="${gi}" class="flex flex-col gap-1 pl-3 ml-2 border-l border-outline-variant/40 mt-0.5 mb-1.5 ${expanded ? '' : 'hidden'}">
                            ${body}
                        </div>
                    </div>
                `;
            });
            productRail.innerHTML = html;
            productRail.scrollTop = scrollTop;
        }

        function setHeaderState(header, expanded) {
            const chev = header.querySelector('.chev');
            const label = header.querySelector('.cat-label');
            const count = header.querySelector('.cat-count');
            if (expanded) {
                chev.classList.add('rotate-90', 'text-primary');
                chev.classList.remove('text-outline-variant');
                if (label) { label.classList.add('text-primary'); label.classList.remove('text-on-surface-variant'); }
                if (count) { count.classList.add('bg-primary/10', 'text-primary'); count.classList.remove('bg-surface-container', 'text-on-surface-variant'); }
            } else {
                chev.classList.remove('rotate-90', 'text-primary');
                chev.classList.add('text-outline-variant');
                if (label) { label.classList.remove('text-primary'); label.classList.add('text-on-surface-variant'); }
                if (count) { count.classList.remove('bg-primary/10', 'text-primary'); count.classList.add('bg-surface-container', 'text-on-surface-variant'); }
            }
        }

        function setContainerState(container, expanded) {
            if (expanded) {
                container.classList.remove('hidden');
                container.classList.remove('rail-in');
                void container.offsetWidth;
                container.classList.add('rail-in');
            } else {
                container.classList.add('hidden');
            }
        }

        function toggleCategory(gi) {
            const g = railGroups[gi];
            if (!g) return;
            const items = productRail.querySelector('[data-cat-items="' + gi + '"]');
            const header = productRail.querySelector('[data-cat-index="' + gi + '"]');
            if (!items || !header) return;
            const nowExpanded = !expandedCategories.has(g.category);
            if (nowExpanded) expandedCategories.add(g.category); else expandedCategories.delete(g.category);
            setHeaderState(header, nowExpanded);
            setContainerState(items, nowExpanded);
        }

        function toggleVariety(gi, si) {
            const g = railGroups[gi];
            if (!g || !g.subgroups || !g.subgroups[si]) return;
            const sg = g.subgroups[si];
            const items = productRail.querySelector('[data-var-items="' + gi + '-' + si + '"]');
            const header = productRail.querySelector('[data-var-index="' + gi + '-' + si + '"]');
            if (!items || !header) return;
            const nowExpanded = !expandedVarieties.has(sg.variety);
            if (nowExpanded) expandedVarieties.add(sg.variety); else expandedVarieties.delete(sg.variety);
            setHeaderState(header, nowExpanded);
            setContainerState(items, nowExpanded);
        }

        // --- Rail 交互：展开/收起品类与品种 + 选择产品 ---
        productRail.addEventListener('click', (e) => {
            const catHeader = e.target.closest('[data-cat-index]');
            if (catHeader) {
                toggleCategory(parseInt(catHeader.getAttribute('data-cat-index'), 10));
                return;
            }
            const varHeader = e.target.closest('[data-var-index]');
            if (varHeader) {
                const parts = varHeader.getAttribute('data-var-index').split('-');
                toggleVariety(parseInt(parts[0], 10), parseInt(parts[1], 10));
                return;
            }
            const item = e.target.closest('[data-product-id]');
            if (item) selectProduct(item.getAttribute('data-product-id'));
        });

        // --- Update Main View ---
        function selectProduct(id) {
            activeProductId = id;
            const prod = productsData.find(p => p.id === id);
            if(!prod) return;

            // Re-render rail to update active styling
            renderRail();

            // Update details texts
            document.getElementById('breadcrumb-name').textContent = prod.name;
            document.getElementById('display-name').textContent = prod.name;

            const lt = prod.liquidType || {};
            const sp = prod.specs || {};

            document.getElementById('liquid-category').textContent = lt.category || '—';
            document.getElementById('liquid-variety').textContent = lt.variety || '—';
            document.getElementById('liquid-claim').textContent = lt.claim || '—';
            document.getElementById('spec-wort').textContent = sp.wort || '—';
            document.getElementById('spec-abv').textContent = sp.abv || '—';
            document.getElementById('spec-shelf-life').textContent = (sp.shelfLife || '—').replace(/\s+/g, '\n');
            document.getElementById('spec-features').textContent = sp.features || '—';
        }

        // --- Mobile Sidebar Logic ---
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        const openBtn = document.getElementById('open-sidebar');
        const closeBtn = document.getElementById('close-sidebar');

        function toggleMenu() {
            const isClosed = sidebar.classList.contains('-translate-x-full');
            if (isClosed) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                document.body.style.overflow = 'hidden'; // Prevent background scrolling
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
                document.body.style.overflow = '';
            }
        }

        openBtn.addEventListener('click', toggleMenu);
        closeBtn.addEventListener('click', toggleMenu);
        overlay.addEventListener('click', toggleMenu);

        // --- Edit Modal Logic ---
        const editBtn = document.getElementById('edit-btn');
        const editModal = document.getElementById('edit-modal');
        const editModalPanel = document.getElementById('edit-modal-panel');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const cancelEditBtn = document.getElementById('cancel-edit-btn');
        const saveEditBtn = document.getElementById('save-edit-btn');
        const editBackdrop = document.getElementById('edit-modal-backdrop');

        // Form fields map
        const formFields = {
            name: document.getElementById('edit-name'),
            code: document.getElementById('edit-code'),
            category: document.getElementById('edit-category'),
            variety: document.getElementById('edit-variety'),
            claim: document.getElementById('edit-claim'),
            wort: document.getElementById('edit-wort'),
            abv: document.getElementById('edit-abv'),
            shelfLife: document.getElementById('edit-shelf-life'),
            features: document.getElementById('edit-features')
        };

        function openModal() {
            const prod = productsData.find(p => p.id === activeProductId);
            if(!prod) return;

            isAddMode = false;

            // Populate form with current product data
            const lt = prod.liquidType || {};
            const sp = prod.specs || {};
            formFields.name.value = prod.name || '';
            formFields.code.value = prod.code || '';
            formFields.category.value = lt.category || '';
            formFields.variety.value = lt.variety || '';
            formFields.claim.value = lt.claim || '';
            formFields.wort.value = sp.wort || '';
            formFields.abv.value = sp.abv || '';
            formFields.shelfLife.value = sp.shelfLife || '';
            formFields.features.value = sp.features || '';

            // Restore modal UI for edit mode
            document.getElementById('modal-title-text').textContent = '编辑产品数据';
            document.getElementById('modal-icon').textContent = 'edit_square';
            saveEditBtn.innerHTML = '保存更改';

            // Show modal with animation
            editModal.classList.remove('hidden');
            // Trigger reflow
            void editModal.offsetWidth;
            editModal.classList.remove('opacity-0');
            editModalPanel.classList.remove('scale-95');
            editModalPanel.classList.add('scale-100');
            document.body.style.overflow = 'hidden'; // Prevent background scrolling
        }

        function closeModal() {
            // Hide modal with animation
            editModal.classList.add('opacity-0');
            editModalPanel.classList.remove('scale-100');
            editModalPanel.classList.add('scale-95');

            setTimeout(() => {
                editModal.classList.add('hidden');
                document.body.style.overflow = '';
            }, 200); // match transition duration

            // Reset add mode state
            isAddMode = false;
        }

        function openAddModal() {
            isAddMode = true;

            // Clear all form fields
            Object.keys(formFields).forEach(key => {
                if (formFields[key]) {
                    formFields[key].value = '';
                }
            });

            // Update modal UI for add mode
            document.getElementById('modal-title-text').textContent = '新增产品';
            document.getElementById('modal-icon').textContent = 'add';
            saveEditBtn.innerHTML = '<span class="material-symbols-outlined text-sm">add</span> 添加产品';

            // Show modal with animation
            editModal.classList.remove('hidden');
            void editModal.offsetWidth;
            editModal.classList.remove('opacity-0');
            editModalPanel.classList.remove('scale-95');
            editModalPanel.classList.add('scale-100');
            document.body.style.overflow = 'hidden';
        }

        function saveEditedData() {
            if (isAddMode) {
                // Generate a new unique ID
                const maxId = productsData.reduce((max, p) => {
                    const num = parseInt(p.id.replace('p', '')) || 0;
                    return Math.max(max, num);
                }, 0);
                const newId = 'p' + (maxId + 1);

                // Generate a product code from the name or use a placeholder
                const nameVal = (formFields.name.value || '新产品').trim();
                const codeVal = formFields.code.value.trim() || ('#P-' + String(maxId + 1).padStart(3, '0'));

                // Create new product object
                const newProduct = {
                    id: newId,
                    name: nameVal,
                    code: codeVal,
                    liquidType: {
                        category: formFields.category.value.trim() || '—',
                        variety: formFields.variety.value.trim() || '—',
                        claim: formFields.claim.value.trim() || '—'
                    },
                    specs: {
                        wort: formFields.wort.value.trim() || '—',
                        abv: formFields.abv.value.trim() || '—',
                        shelfLife: formFields.shelfLife.value.trim() || '—',
                        features: formFields.features.value.trim() || '—'
                    }
                };

                // Add to products array
                productsData.push(newProduct);

                // 永久保存：写回 products.json
                persistProducts();

                // Re-render and select the new product
                activeProductId = newId;
                renderRail();
                selectProduct(newId);
                updateSystemInfo();

                // Close the modal
                closeModal();
                return;
            }

            const prod = productsData.find(p => p.id === activeProductId);
            if(!prod) return;

            // Update underlying data object (nested groups)
            prod.name = formFields.name.value;
            prod.code = formFields.code.value;
            prod.liquidType = {
                category: formFields.category.value.trim() || '—',
                variety: formFields.variety.value.trim() || '—',
                claim: formFields.claim.value.trim() || '—'
            };
            prod.specs = {
                wort: formFields.wort.value.trim() || '—',
                abv: formFields.abv.value.trim() || '—',
                shelfLife: formFields.shelfLife.value.trim() || '—',
                features: formFields.features.value.trim() || '—'
            };

            // 永久保存：写回 products.json
            persistProducts();

            // Re-render UI to reflect changes immediately
            selectProduct(activeProductId);

            // Close the modal
            closeModal();
        }

        // Event Listeners for Edit functionality
        if (editBtn) editBtn.addEventListener('click', openModal);
        closeModalBtn.addEventListener('click', closeModal);
        cancelEditBtn.addEventListener('click', closeModal);
        editBackdrop.addEventListener('click', closeModal);
        saveEditBtn.addEventListener('click', saveEditedData);

        // Event Listener for Add Product button
        const addProductBtn = document.getElementById('add-product-btn');
        if (addProductBtn) addProductBtn.addEventListener('click', openAddModal);

        // --- Update System Info ---
        function updateSystemInfo() {
            const skuCountEl = document.getElementById('sku-count');
            const timeEl = document.getElementById('last-updated-time');
            
            if(skuCountEl) {
                // 读取系统真实的数据长度 (productsData 数组)
                skuCountEl.textContent = productsData.length;
            }
            if(timeEl) {
                // 动态生成当前的系统时间
                const now = new Date();
                const timeString = now.getHours().toString().padStart(2, '0') + ':' + 
                                 now.getMinutes().toString().padStart(2, '0');
                timeEl.textContent = '今天 ' + timeString;
            }
        }

        // --- Load products from JSON or localStorage ---
        const STORAGE_KEY = 'product_archive_v6';

        async function loadProducts() {
            // 始终以 products.json 为准，每次刷新都读取最新数据
            try {
                const response = await fetch('products.json', { cache: 'no-store' });
                if (!response.ok) throw new Error('Failed to load products.json');
                productsData = await response.json();
                // 同步写入 localStorage，仅作为离线缓存
                localStorage.setItem(STORAGE_KEY, JSON.stringify(productsData));
            } catch (err) {
                console.warn('products.json 加载失败，回退到 localStorage 缓存', err);
                // 读取失败时，使用 localStorage 里的缓存数据
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    try {
                        productsData = JSON.parse(stored);
                    } catch (e) {
                        productsData = [];
                    }
                } else {
                    productsData = [];
                }
            }
        }

        // --- 永久保存：把前端数据写回 products.json（通过本地服务器） ---
        async function persistProducts() {
            try {
                const res = await fetch('/api/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(productsData)
                });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const result = await res.json();
                if (!result.ok) throw new Error(result.error || '保存失败');
                console.log('已保存到 products.json，共 ' + result.count + ' 条产品');
            } catch (err) {
                // 服务器不可用时，回退到 localStorage 并明确提示
                localStorage.setItem(STORAGE_KEY, JSON.stringify(productsData));
                alert('保存到 products.json 失败！\n请确认你是通过 http://localhost:8000 打开页面的（而不是直接双击 HTML 文件）。\n\n本次改动已暂存到浏览器本地缓存。\n\n错误信息：' + err.message);
            }
        }

        // --- 包装形式对比：数据与渲染 ---
        const CATEGORY_COLORS = {
            '易拉罐': '#0c5fae',
            '马口铁桶': '#8b5000',
            '玻璃瓶': '#166c42',
            '不锈钢桶': '#455a64',
            'PET桶': '#006a60'
        };

        function categoryColor(cat) {
            return CATEGORY_COLORS[cat] || '#5f6368';
        }

        function formatVolume(v) {
            if (typeof v === 'number') return v + ' mL';
            const s = String(v);
            return /^\d+$/.test(s) ? s + ' mL' : s;
        }

        function formatPackSpec(v) {
            return String(v).replace(/\*/g, '×');
        }

        function dimText(v) {
            return (v === null || v === undefined || v === '') ? '—' : v + ' mm';
        }

        async function loadPackaging() {
            try {
                const res = await fetch('packaging.json', { cache: 'no-store' });
                if (!res.ok) throw new Error('Failed to load packaging.json');
                packagingData = await res.json();
            } catch (err) {
                console.warn('包装数据加载失败:', err);
                packagingData = [];
            }
            renderPackagingTable();
        }

        function renderPackagingTable() {
            const container = document.getElementById('packaging-table-container');
            if (!container) return;
            const subtitle = document.getElementById('packaging-subtitle');
            if (subtitle) subtitle.textContent = '共 ' + packagingData.length + ' 种包装形式，横向对比材质、容量、包装规格、高度与直径等参数。';
            if (!packagingData.length) {
                container.innerHTML = '<p class="p-6 text-sm text-on-surface-variant">暂无包装数据</p>';
                return;
            }
            const HEADERS = ['分类', '规格', '材质', '包装规格', '高度 (mm)', '直径 (mm)', '图示', '备注'];
            const thead = HEADERS.map(l =>
                '<th class="px-4 py-3 text-left text-[11px] font-extrabold text-on-surface-variant uppercase tracking-wider bg-surface-container-low border-b border-outline-variant/60 whitespace-nowrap">' + l + '</th>'
            ).join('');

            const tbody = packagingData.map((p, i) => {
                const cat = p['分类'] || '—';
                const dim = p['参数_mm'] || {};
                const color = categoryColor(cat);
                const img = 'package_' + (i + 1) + '.png';
                const note = (dim['备注'] === undefined || dim['备注'] === null || dim['备注'] === '') ? '—' : dim['备注'];

                const cells = [
                    '<td class="px-4 py-3 whitespace-nowrap"><span class="inline-flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full flex-shrink-0" style="background-color:' + color + '"></span><span class="font-bold text-on-surface">' + cat + '</span></span></td>',
                    '<td class="px-4 py-3 whitespace-nowrap text-on-surface font-semibold">' + formatVolume(p['规格_ml']) + '</td>',
                    '<td class="px-4 py-3 whitespace-nowrap"><span class="inline-flex items-center px-2.5 py-0.5 rounded-md text-xs font-semibold bg-surface-container text-on-surface-variant">' + (p['材质'] || '—') + '</span></td>',
                    '<td class="px-4 py-3 whitespace-nowrap text-on-surface">' + formatPackSpec(p['包装规格']) + '</td>',
                    '<td class="px-4 py-3 whitespace-nowrap text-on-surface">' + dimText(dim['高度']) + '</td>',
                    '<td class="px-4 py-3 whitespace-nowrap text-on-surface">' + dimText(dim['直径']) + '</td>',
                    '<td class="px-3 py-2"><div class="h-16 w-20 flex items-center justify-center rounded-lg border border-outline-variant/40 bg-white overflow-hidden"><img src="' + img + '" alt="' + cat + '" loading="lazy" class="h-14 w-auto max-w-full object-contain" onerror="this.style.opacity=0"></div></td>',
                    '<td class="px-4 py-3 whitespace-nowrap text-on-surface-variant">' + note + '</td>'
                ].join('');

                return '<tr class="border-b border-outline-variant/40 last:border-0 hover:bg-surface-container-low/50 transition-colors">' + cells + '</tr>';
            }).join('');

            container.innerHTML = '<div class="overflow-x-auto"><table class="w-full text-sm border-collapse"><thead><tr>' + thead + '</tr></thead><tbody>' + tbody + '</tbody></table></div>';
        }

        // --- 搜索产品 ---
        const searchInput = document.getElementById('search-input');
        const searchResults = document.getElementById('search-results');

        function renderSearchResults(query) {
            const q = query.trim().toLowerCase();
            if (!q) { searchResults.classList.add('hidden'); searchResults.innerHTML = ''; return; }
            const matches = productsData.filter(p => (p.name || '').toLowerCase().includes(q));
            if (!matches.length) {
                searchResults.innerHTML = '<div class="px-4 py-3 text-sm text-on-surface-variant">未找到匹配的产品</div>';
            } else {
                searchResults.innerHTML = matches.map(p => `
                    <button type="button" data-search-id="${p.id}" class="w-full flex items-center gap-2 px-4 py-2.5 text-left text-sm text-on-surface hover:bg-surface-container-low transition-colors border-b border-outline-variant/40 last:border-0">
                        <span class="material-symbols-outlined text-base text-outline-variant">local_drink</span>
                        <span class="flex-1 truncate font-medium">${p.name}</span>
                        <span class="material-symbols-outlined text-base text-outline-variant">chevron_right</span>
                    </button>
                `).join('');
            }
            searchResults.classList.remove('hidden');
        }

        searchInput.addEventListener('input', () => renderSearchResults(searchInput.value));
        searchInput.addEventListener('focus', () => { if (searchInput.value.trim()) renderSearchResults(searchInput.value); });

        searchResults.addEventListener('click', (e) => {
            const btn = e.target.closest('[data-search-id]');
            if (!btn) return;
            selectProduct(btn.getAttribute('data-search-id'));
            searchInput.value = '';
            searchResults.classList.add('hidden');
            searchResults.innerHTML = '';
        });

        document.addEventListener('click', (e) => {
            if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
                searchResults.classList.add('hidden');
            }
        });

        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                searchResults.classList.add('hidden');
                searchInput.blur();
            }
        });

        // --- Initialize ---
        window.addEventListener('load', async () => {
            await loadProducts();
            loadPackaging();
            if (productsData.length > 0) {
                activeProductId = productsData[0].id;
            }
            renderRail();
            if (activeProductId) {
                selectProduct(activeProductId);
            }
            updateSystemInfo();
        });
    </script>
</body>
</html>
