    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface": "#f8f9fa",
                        "secondary": "#0c5fae",
                        "surface-container": "#eceeef",
                        "error-container": "#ffdad6",
                        "primary": "#004727",
                        "error": "#ba1a1a",
                        "secondary-fixed": "#d5e3ff",
                        "on-primary-fixed-variant": "#00522f",
                        "background": "#f8f9fa",
                        "primary-fixed": "#a2f4be",
                        "primary-container": "#006138",
                        "surface-tint": "#166c42",
                        "inverse-surface": "#2e3132",
                        "surface-container-low": "#f2f4f5",
                        "tertiary-container": "#ab0023",
                        "surface-dim": "#d8dadb",
                        "secondary-container": "#6eaafe",
                        "tertiary-fixed-dim": "#ffb3b1",
                        "on-background": "#191c1d",
                        "on-primary": "#ffffff",
                        "on-secondary-fixed": "#001c3b",
                        "on-secondary-fixed-variant": "#004787",
                        "on-error-container": "#93000a",
                        "on-tertiary": "#ffffff",
                        "inverse-primary": "#87d8a4",
                        "on-error": "#ffffff",
                        "on-tertiary-fixed-variant": "#92001c",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary": "#ffffff",
                        "on-primary-container": "#89daa6",
                        "on-tertiary-container": "#ffb5b3",
                        "surface-container-high": "#e7e8e9",
                        "surface-bright": "#f8f9fa",
                        "on-surface": "#191c1d",
                        "secondary-fixed-dim": "#a6c8ff",
                        "primary-fixed-dim": "#87d8a4",
                        "outline-variant": "#bfc9bf",
                        "tertiary-fixed": "#ffdad8",
                        "on-secondary-container": "#003e76",
                        "surface-container-highest": "#e1e3e4",
                        "on-surface-variant": "#3f4941",
                        "surface-variant": "#e1e3e4",
                        "on-primary-fixed": "#002110",
                        "inverse-on-surface": "#eff1f2",
                        "on-tertiary-fixed": "#410007",
                        "outline": "#6f7a71",

        }
    </script>
    <style>
        body { font-family: 'Manrope', 'Noto Sans SC', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Hide scrollbar for cleaner UI */
        .no-scrollbar::-webkit-scrollbar { display: none; }

        /* 品类分组展开动画 */
        @keyframes rail-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
        .rail-in { animation: rail-in 0.18s ease; }
    </style>
</head>

    <script>
        // --- Product data loaded from JSON ---
        let productsData = [];
        let activeProductId = null;
        let packagingData = [];
        let expandedCategories = new Set();
        let railGroups = [];
        let expandedVarieties = new Set();

        // --- DOM Elements ---
        const productRail = document.getElementById('product-rail');

        // --- 将 products_all.json 的嵌套结构展开为扁平产品列表 ---
        function flattenProducts(raw) {
            const list = [];
            const root = (raw && raw['产品库']) ? raw['产品库'] : (raw || {});
            Object.keys(root).forEach(category => {
                const varieties = root[category] || {};
                Object.keys(varieties).forEach(variety => {
                    const products = varieties[variety] || {};
                    Object.keys(products).forEach(name => {
                        const f = products[name] || {};
                        list.push({
                            id: category + '/' + variety + '/' + name,
                            category: category,
                            variety: variety,
                            name: name,
                            claim: f['对应市售产品品类'] || '—',
                            process: f['工艺特点'] || '—',
                            flavor: f['风味特点'] || '—',
                            packaging: f['包装形式'] || '—',
                            factory: f['生产工厂'] || '',
                            sc: f['SC证'] || '',
                            skus: Array.isArray(f['产品列表']) ? f['产品列表'] : []
                        });
                    });
                });
            });
            return list;
        }

        function productItemHtml(prod) {
            const isActive = prod.id === activeProductId;
            const itemClass = isActive ? 'bg-primary-container/10 border-primary text-primary font-bold' : 'border-transparent text-on-surface font-medium hover:bg-surface-container-low';
            return `
                <div data-product-id="${prod.id}" class="flex items-center gap-2 px-3 py-2 rounded-lg border-l-2 cursor-pointer transition-all ${itemClass}">
                    <span class="text-sm truncate flex-1">${prod.name}</span>
                </div>
            `;
        }

        function renderRail() {
            // 按「品类 → 品种」两级分组，保持首次出现的顺序
            const groups = [];
            const catIndex = {};
            const varIndex = {};
            productsData.forEach(prod => {
                let g;
                if (prod.category in catIndex) {
                    g = groups[catIndex[prod.category]];
                } else {
                    catIndex[prod.category] = groups.length;
                    g = { category: prod.category, varieties: [], count: 0 };
                    groups.push(g);
                }
                g.count += 1;
                const vkey = prod.category + '||' + prod.variety;
                let vg;
                if (vkey in varIndex) {
                    vg = g.varieties[varIndex[vkey]];
                } else {
                    varIndex[vkey] = g.varieties.length;
                    vg = { variety: prod.variety, items: [] };
                    g.varieties.push(vg);
                }
                vg.items.push(prod);
            });
            railGroups = groups;

            // 自动展开当前选中产品所在的品类与品种
            if (activeProductId) {
                const active = productsData.find(p => p.id === activeProductId);
                if (active) {
                    expandedCategories.add(active.category);
                    expandedVarieties.add(active.category + '||' + active.variety);
                }
            }

            const scrollTop = productRail.scrollTop;
            let html = '';
            groups.forEach((g, gi) => {
                const expanded = expandedCategories.has(g.category);
                const chevClass = expanded ? 'rotate-90 text-primary' : 'text-outline-variant';
                const labelClass = expanded ? 'text-primary' : 'text-on-surface-variant';
                const countClass = expanded ? 'bg-primary/10 text-primary' : 'bg-surface-container text-on-surface-variant';

                const body = g.varieties.map((vg, si) => {
                    const vkey = g.category + '||' + vg.variety;
                    const vExpanded = expandedVarieties.has(vkey);
                    const vChevClass = vExpanded ? 'rotate-90 text-primary' : 'text-outline-variant';
                    const vLabelClass = vExpanded ? 'text-primary' : 'text-on-surface-variant';
                    const vCountClass = vExpanded ? 'bg-primary/10 text-primary' : 'bg-surface-container text-on-surface-variant';
                    return `
                        <div class="flex flex-col">
                            <button type="button" data-var-index="${gi}-${si}" class="w-full flex items-center gap-1.5 px-2 py-1.5 rounded-lg text-left transition-colors hover:bg-surface-container-low">
                                <span class="material-symbols-outlined text-base transition-transform chev ${vChevClass}">chevron_right</span>
                                <span class="text-xs font-semibold flex-1 truncate cat-label ${vLabelClass}">${vg.variety}</span>
                                <span class="text-[10px] font-bold px-1.5 py-0.5 rounded-full cat-count ${vCountClass}">${vg.items.length}</span>
                            </button>
                            <div data-var-items="${gi}-${si}" class="flex flex-col gap-1 pl-3 ml-2 border-l border-outline-variant/40 mt-0.5 mb-1 ${vExpanded ? '' : 'hidden'}">
                                ${vg.items.map(productItemHtml).join('')}
                            </div>
                        </div>
                    `;
                }).join('');

                html += `
                    <div class="flex flex-col">
                        <button type="button" data-cat-index="${gi}" class="w-full flex items-center gap-1.5 px-2 py-2 rounded-lg text-left transition-colors hover:bg-surface-container-low">
                            <span class="material-symbols-outlined text-base transition-transform chev ${chevClass}">chevron_right</span>
                            <span class="text-xs font-bold uppercase tracking-wide flex-1 truncate cat-label ${labelClass}">${g.category}</span>
                            <span class="text-[10px] font-bold px-1.5 py-0.5 rounded-full cat-count ${countClass}">${g.count}</span>
                        </button>
                        <div data-cat-items="${gi}" class="flex flex-col gap-1 pl-3 ml-2 border-l border-outline-variant/40 mt-0.5 mb-1.5 ${expanded ? '' : 'hidden'}">
                            ${body}
                        </div>
                    </div>
                `;
            });
            productRail.innerHTML = html;
            productRail.scrollTop = scrollTop;
        }

        function setHeaderState(header, expanded) {
            const chev = header.querySelector('.chev');
            const label = header.querySelector('.cat-label');
            const count = header.querySelector('.cat-count');
            if (expanded) {
                chev.classList.add('rotate-90', 'text-primary');
                chev.classList.remove('text-outline-variant');
                if (label) { label.classList.add('text-primary'); label.classList.remove('text-on-surface-variant'); }
                if (count) { count.classList.add('bg-primary/10', 'text-primary'); count.classList.remove('bg-surface-container', 'text-on-surface-variant'); }
            } else {
                chev.classList.remove('rotate-90', 'text-primary');
                chev.classList.add('text-outline-variant');
                if (label) { label.classList.remove('text-primary'); label.classList.add('text-on-surface-variant'); }
                if (count) { count.classList.remove('bg-primary/10', 'text-primary'); count.classList.add('bg-surface-container', 'text-on-surface-variant'); }
            }
        }

        function setContainerState(container, expanded) {
            if (expanded) {
                container.classList.remove('hidden');
                container.classList.remove('rail-in');
                void container.offsetWidth;
                container.classList.add('rail-in');
            } else {
                container.classList.add('hidden');
            }
        }

        function toggleCategory(gi) {
            const g = railGroups[gi];
            if (!g) return;
            const items = productRail.querySelector('[data-cat-items="' + gi + '"]');
            const header = productRail.querySelector('[data-cat-index="' + gi + '"]');
            if (!items || !header) return;
            const nowExpanded = !expandedCategories.has(g.category);
            if (nowExpanded) expandedCategories.add(g.category); else expandedCategories.delete(g.category);
            setHeaderState(header, nowExpanded);
            setContainerState(items, nowExpanded);
        }

        function toggleVariety(gi, si) {
            const g = railGroups[gi];
            if (!g || !g.varieties || !g.varieties[si]) return;
            const vg = g.varieties[si];
            const vkey = g.category + '||' + vg.variety;
            const items = productRail.querySelector('[data-var-items="' + gi + '-' + si + '"]');
            const header = productRail.querySelector('[data-var-index="' + gi + '-' + si + '"]');
            if (!items || !header) return;
            const nowExpanded = !expandedVarieties.has(vkey);
            if (nowExpanded) expandedVarieties.add(vkey); else expandedVarieties.delete(vkey);
            setHeaderState(header, nowExpanded);
            setContainerState(items, nowExpanded);
        }

        // --- Rail 交互：展开/收起品类与品种 + 选择产品 ---
        productRail.addEventListener('click', (e) => {
            const catHeader = e.target.closest('[data-cat-index]');
            if (catHeader) {
                toggleCategory(parseInt(catHeader.getAttribute('data-cat-index'), 10));
                return;
            }
            const varHeader = e.target.closest('[data-var-index]');
            if (varHeader) {
                const parts = varHeader.getAttribute('data-var-index').split('-');
                toggleVariety(parseInt(parts[0], 10), parseInt(parts[1], 10));
                return;
            }
            const item = e.target.closest('[data-product-id]');
            if (item) selectProduct(item.getAttribute('data-product-id'));
        });

        // --- Update Main View ---
        function selectProduct(id) {
            activeProductId = id;
            const prod = productsData.find(p => p.id === id);
            if(!prod) return;

            // 切回产品详情视图（若当前在总览视图）
            showProductView();

            // Re-render rail to update active styling
            renderRail();

            // Update breadcrumb & title
            document.getElementById('breadcrumb-category').textContent = prod.category;
            document.getElementById('breadcrumb-variety').textContent = prod.variety;
            document.getElementById('display-name').textContent = prod.name;

            // 基本信息
            document.getElementById('liquid-category').textContent = prod.category;
            document.getElementById('liquid-variety').textContent = prod.variety;
            document.getElementById('product-claim').textContent = prod.claim;
            document.getElementById('product-process').textContent = prod.process;
            document.getElementById('product-flavor').textContent = prod.flavor;
            document.getElementById('product-packaging').textContent = prod.packaging;

            // 生产工厂 / SC证（有值才显示）
            const fsRow = document.getElementById('factory-sc-row');
            const hasFactory = prod.factory && prod.factory.trim() !== '';
            const hasSc = prod.sc && prod.sc.trim() !== '';
            if (hasFactory || hasSc) {
                fsRow.classList.remove('hidden');
                document.getElementById('product-factory').textContent = hasFactory ? prod.factory : '—';
                document.getElementById('product-sc').textContent = hasSc ? prod.sc : '—';
            } else {
                fsRow.classList.add('hidden');
            }

            // 产品指标明细（产品列表）
            renderSkuTable(prod);
        }

        function renderSkuTable(prod) {
            const container = document.getElementById('sku-table-container');
            const subtitle = document.getElementById('sku-subtitle');
            if (!container) return;
            const skus = prod.skus || [];
            if (subtitle) subtitle.textContent = '共 ' + skus.length + ' 个规格，列出原麦汁浓度、酒精度与保质期。';
            if (!skus.length) {
                container.innerHTML = '<p class="p-6 text-sm text-on-surface-variant">暂无规格数据</p>';
                return;
            }
            const thead = ['序号', '原麦汁浓度', '酒精度', '保质期'].map(l =>
                '<th class="px-4 py-3 text-left text-[11px] font-extrabold text-on-surface-variant uppercase tracking-wider bg-surface-container-low border-b border-outline-variant/60 whitespace-nowrap">' + l + '</th>'
            ).join('');
            const tbody = skus.map(s => {
                const no = (s['序号'] === undefined || s['序号'] === null) ? '—' : s['序号'];
                const wort = s['原麦汁浓度'] || '—';
                const abv = s['酒精度'] || '—';
                const shelf = (s['保质期'] || '—').replace(/\s+/g, ' ');
                return '<tr class="border-b border-outline-variant/40 last:border-0 hover:bg-surface-container-low/50 transition-colors align-top">' +
                    '<td class="px-4 py-3 whitespace-nowrap text-on-surface-variant font-semibold">' + no + '</td>' +
                    '<td class="px-4 py-3 whitespace-nowrap text-on-surface font-semibold">' + wort + '</td>' +
                    '<td class="px-4 py-3 whitespace-nowrap text-on-surface font-semibold">' + abv + '</td>' +
                    '<td class="px-4 py-3 text-on-surface leading-relaxed min-w-[260px]">' + shelf + '</td>' +
                '</tr>';
            }).join('');
            container.innerHTML = '<div class="overflow-x-auto"><table class="w-full text-sm border-collapse"><thead><tr>' + thead + '</tr></thead><tbody>' + tbody + '</tbody></table></div>';
        }

        // --- 总览视图 ---
        const BEER_CATEGORY_COLORS = {
            '拉格': '#166c42',
            '艾尔': '#0c5fae',
            '特种啤酒': '#8b5000'
        };

        function beerCategoryColor(cat) {
            return BEER_CATEGORY_COLORS[cat] || '#5f6368';
        }

        const productView = document.getElementById('product-view');
        const overviewView = document.getElementById('overview-view');
        const overviewBtn = document.getElementById('overview-btn');
        const overviewCount = document.getElementById('overview-count');
        const packagingOverviewView = document.getElementById('packaging-overview-view');
        const packagingOverviewBtn = document.getElementById('packaging-overview-btn');

        function setNavActive(activeBtn) {
            [overviewBtn, packagingOverviewBtn].forEach(b => {
                if (b === activeBtn) {
                    b.classList.add('bg-primary/10', 'text-primary');
                    b.classList.remove('text-on-surface-variant');
                } else {
                    b.classList.remove('bg-primary/10', 'text-primary');
                    b.classList.add('text-on-surface-variant');
                }
            });
        }

        function showOnly(view) {
            [productView, overviewView, packagingOverviewView].forEach(v => {
                if (v === view) v.classList.remove('hidden');
                else v.classList.add('hidden');
            });
        }

        function showOverview() {
            showOnly(overviewView);
            setNavActive(overviewBtn);
        }

        function showPackagingOverview() {
            showOnly(packagingOverviewView);
            setNavActive(packagingOverviewBtn);
        }

        function showProductView() {
            showOnly(productView);
            setNavActive(null);
        }

        overviewBtn.addEventListener('click', showOverview);
        packagingOverviewBtn.addEventListener('click', showPackagingOverview);

        function renderOverviewTable() {
            const container = document.getElementById('overview-table-container');
            if (!container) return;
            const subtitle = document.getElementById('overview-subtitle');
            const totalSkus = productsData.reduce((n, p) => n + ((p.skus && p.skus.length) ? p.skus.length : 0), 0);
            if (subtitle) subtitle.textContent = '共 ' + productsData.length + ' 个产品 · ' + totalSkus + ' 个规格，汇总全部产品的品类、品种、工艺、风味、包装与指标。';
            if (overviewCount) overviewCount.textContent = productsData.length;
            if (!productsData.length) {
                container.innerHTML = '<p class="p-6 text-sm text-on-surface-variant">暂无产品数据</p>';
                return;
            }
            const COLS = [
                { label: '品类', w: '7%' },
                { label: '品种', w: '8%' },
                { label: '产品名称', w: '8%' },
                { label: '对应市售产品品类', w: '7%' },
                { label: '工艺特点', w: '9%' },
                { label: '风味特点', w: '9%' },
                { label: '包装形式', w: '13%' },
                { label: '生产工厂', w: '6%' },
                { label: 'SC证', w: '7%' },
                { label: '原麦汁浓度', w: '7%' },
                { label: '酒精度', w: '6%' },
                { label: '保质期', w: '13%' }
            ];
            const colgroup = '<colgroup>' + COLS.map(c => '<col style="width:' + c.w + '">').join('') + '</colgroup>';
            const thead = COLS.map(l =>
                '<th class="px-2.5 py-3 text-left text-[11px] font-extrabold text-on-surface-variant uppercase tracking-wider bg-surface-container-low border-b border-outline-variant/60 leading-snug align-middle">' + l.label + '</th>'
            ).join('');

            let tbody = '';
            productsData.forEach(p => {
                const skus = (p.skus && p.skus.length) ? p.skus : [{}];
                const color = beerCategoryColor(p.category);
                const rowCount = skus.length;
                const shelfValues = skus.map(s => (s['保质期'] || '—').replace(/\s+/g, ' '));
                const shelfSame = rowCount > 1 && shelfValues.every(v => v === shelfValues[0]);
                skus.forEach((s, i) => {
                    let cells = '';
                    if (i === 0) {
                        cells += '<td rowspan="' + rowCount + '" class="px-2.5 py-3 align-middle bg-surface-container-low/40 border-r border-outline-variant/40"><span class="inline-flex items-center gap-1.5"><span class="w-2 h-2 rounded-full flex-shrink-0" style="background-color:' + color + '"></span><span class="font-bold text-on-surface leading-snug">' + p.category + '</span></span></td>';
                        cells += '<td rowspan="' + rowCount + '" class="px-2.5 py-3 align-middle bg-surface-container-low/40 border-r border-outline-variant/40 text-on-surface-variant font-semibold leading-snug">' + p.variety + '</td>';
                        cells += '<td rowspan="' + rowCount + '" class="px-2.5 py-3 align-middle bg-surface-container-low/40 border-r border-outline-variant/40"><button type="button" data-overview-product-id="' + p.id + '" class="font-bold text-primary hover:underline text-left leading-snug">' + p.name + '</button></td>';
                        cells += '<td rowspan="' + rowCount + '" class="px-2.5 py-3 align-middle bg-surface-container-low/40 border-r border-outline-variant/40 text-on-surface leading-relaxed break-words">' + p.claim + '</td>';
                        cells += '<td rowspan="' + rowCount + '" class="px-2.5 py-3 align-middle bg-surface-container-low/40 border-r border-outline-variant/40 text-on-surface leading-relaxed break-words">' + p.process + '</td>';
                        cells += '<td rowspan="' + rowCount + '" class="px-2.5 py-3 align-middle bg-surface-container-low/40 border-r border-outline-variant/40 text-on-surface leading-relaxed break-words">' + p.flavor + '</td>';
                        cells += '<td rowspan="' + rowCount + '" class="px-2.5 py-3 align-middle bg-surface-container-low/40 border-r border-outline-variant/40 text-on-surface leading-relaxed break-words">' + p.packaging + '</td>';
                        cells += '<td rowspan="' + rowCount + '" class="px-2.5 py-3 align-middle bg-surface-container-low/40 border-r border-outline-variant/40 text-on-surface-variant leading-snug break-words">' + (p.factory || '—') + '</td>';
                        cells += '<td rowspan="' + rowCount + '" class="px-2.5 py-3 align-middle bg-surface-container-low/40 border-r border-outline-variant/40 text-on-surface-variant leading-snug break-all">' + (p.sc || '—') + '</td>';
                    }
                    cells += '<td class="px-2.5 py-3 whitespace-nowrap align-middle text-on-surface font-semibold">' + (s['原麦汁浓度'] || '—') + '</td>';
                    cells += '<td class="px-2.5 py-3 whitespace-nowrap align-middle text-on-surface font-semibold">' + (s['酒精度'] || '—') + '</td>';
                    if (shelfSame) {
                        if (i === 0) {
                            cells += '<td rowspan="' + rowCount + '" class="px-2.5 py-3 text-on-surface leading-relaxed break-words align-middle">' + shelfValues[0] + '</td>';
                        }
                    } else {
                        cells += '<td class="px-2.5 py-3 text-on-surface leading-relaxed break-words align-middle">' + shelfValues[i] + '</td>';
                    }
                    tbody += '<tr class="border-b border-outline-variant/40 last:border-0 hover:bg-surface-container-low/50 transition-colors align-middle">' + cells + '</tr>';
                });
            });

            container.innerHTML = '<table class="w-full text-sm border-collapse table-fixed">' + colgroup + '<thead><tr>' + thead + '</tr></thead><tbody>' + tbody + '</tbody></table>';
        }

        document.getElementById('overview-table-container').addEventListener('click', (e) => {
            const btn = e.target.closest('[data-overview-product-id]');
            if (btn) selectProduct(btn.getAttribute('data-overview-product-id'));
        });

        // --- Mobile Sidebar Logic ---
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        const openBtn = document.getElementById('open-sidebar');
        const closeBtn = document.getElementById('close-sidebar');

        function toggleMenu() {
            const isClosed = sidebar.classList.contains('-translate-x-full');
            if (isClosed) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                document.body.style.overflow = 'hidden'; // Prevent background scrolling
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
                document.body.style.overflow = '';
            }
        }

        openBtn.addEventListener('click', toggleMenu);
        closeBtn.addEventListener('click', toggleMenu);
        overlay.addEventListener('click', toggleMenu);

        // --- Load products from JSON ---
        async function loadProducts() {
            try {
                const response = await fetch('products_all.json', { cache: 'no-store' });
                if (!response.ok) throw new Error('Failed to load products_all.json');
                productsData = flattenProducts(await response.json());
            } catch (err) {
                console.warn('products_all.json 加载失败:', err);
                productsData = [];
            }
        }

        // --- 包装形式对比：数据与渲染 ---
        const CATEGORY_COLORS = {
            '易拉罐': '#0c5fae',
            '马口铁桶': '#8b5000',
            '玻璃瓶': '#166c42',
            '不锈钢桶': '#455a64',
            'PET桶': '#006a60'
        };

        function categoryColor(cat) {
            return CATEGORY_COLORS[cat] || '#5f6368';
        }

        function formatVolume(v) {
            if (typeof v === 'number') return v + ' mL';
            const s = String(v);
            return /^\d+$/.test(s) ? s + ' mL' : s;
        }

        function formatPackSpec(v) {
            return String(v).replace(/\*/g, '×');
        }

        function dimText(v) {
            return (v === null || v === undefined || v === '') ? '—' : v + ' mm';
        }

        async function loadPackaging() {
            try {
                const res = await fetch('packaging.json', { cache: 'no-store' });
                if (!res.ok) throw new Error('Failed to load packaging.json');
                packagingData = await res.json();
            } catch (err) {
                console.warn('包装数据加载失败:', err);
                packagingData = [];
            }
            renderPackagingTable();
        }

        function renderPackagingTable() {
            const container = document.getElementById('packaging-table-container');
            const overviewContainer = document.getElementById('packaging-overview-container');
            const subtitle = document.getElementById('packaging-subtitle');
            const overviewSubtitle = document.getElementById('packaging-overview-subtitle');
            const packagingCount = document.getElementById('packaging-overview-count');
            const totalText = '共 ' + packagingData.length + ' 种包装形式，横向对比材质、容量、包装规格、高度与直径等参数。';
            if (subtitle) subtitle.textContent = totalText;
            if (overviewSubtitle) overviewSubtitle.textContent = totalText;
            if (packagingCount) packagingCount.textContent = packagingData.length;
            if (!packagingData.length) {
                const empty = '<p class="p-6 text-sm text-on-surface-variant">暂无包装数据</p>';
                if (container) container.innerHTML = empty;
                if (overviewContainer) overviewContainer.innerHTML = empty;
                return;
            }
            const HEADERS = ['分类', '规格', '材质', '包装规格', '高度 (mm)', '直径 (mm)', '图示', '备注'];
            const thead = HEADERS.map(l =>
                '<th class="px-4 py-3 text-left text-[11px] font-extrabold text-on-surface-variant uppercase tracking-wider bg-surface-container-low border-b border-outline-variant/60 whitespace-nowrap">' + l + '</th>'
            ).join('');

            const tbody = packagingData.map((p, i) => {
                const cat = p['分类'] || '—';
                const dim = p['参数_mm'] || {};
                const color = categoryColor(cat);
                const img = 'package_' + (i + 1) + '.png';
                const note = (dim['备注'] === undefined || dim['备注'] === null || dim['备注'] === '') ? '—' : dim['备注'];

                const cells = [
                    '<td class="px-4 py-3 whitespace-nowrap"><span class="inline-flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full flex-shrink-0" style="background-color:' + color + '"></span><span class="font-bold text-on-surface">' + cat + '</span></span></td>',
                    '<td class="px-4 py-3 whitespace-nowrap text-on-surface font-semibold">' + formatVolume(p['规格_ml']) + '</td>',
                    '<td class="px-4 py-3 whitespace-nowrap"><span class="inline-flex items-center px-2.5 py-0.5 rounded-md text-xs font-semibold bg-surface-container text-on-surface-variant">' + (p['材质'] || '—') + '</span></td>',
                    '<td class="px-4 py-3 whitespace-nowrap text-on-surface">' + formatPackSpec(p['包装规格']) + '</td>',
                    '<td class="px-4 py-3 whitespace-nowrap text-on-surface">' + dimText(dim['高度']) + '</td>',
                    '<td class="px-4 py-3 whitespace-nowrap text-on-surface">' + dimText(dim['直径']) + '</td>',
                    '<td class="px-3 py-2"><div class="h-16 w-20 flex items-center justify-center rounded-lg border border-outline-variant/40 bg-white overflow-hidden"><img src="' + img + '" alt="' + cat + '" loading="lazy" class="h-14 w-auto max-w-full object-contain" onerror="this.style.opacity=0"></div></td>',
                    '<td class="px-4 py-3 whitespace-nowrap text-on-surface-variant">' + note + '</td>'
                ].join('');

                return '<tr class="border-b border-outline-variant/40 last:border-0 hover:bg-surface-container-low/50 transition-colors">' + cells + '</tr>';
            }).join('');

            const tableHtml = '<div class="overflow-x-auto"><table class="w-full text-sm border-collapse"><thead><tr>' + thead + '</tr></thead><tbody>' + tbody + '</tbody></table></div>';
            if (container) container.innerHTML = tableHtml;
            if (overviewContainer) overviewContainer.innerHTML = tableHtml;
        }

        // --- 搜索产品 ---
        const searchInput = document.getElementById('search-input');
        const searchResults = document.getElementById('search-results');

        function renderSearchResults(query) {
            const q = query.trim().toLowerCase();
            if (!q) { searchResults.classList.add('hidden'); searchResults.innerHTML = ''; return; }
            const matches = productsData.filter(p => (p.name || '').toLowerCase().includes(q));
            if (!matches.length) {
                searchResults.innerHTML = '<div class="px-4 py-3 text-sm text-on-surface-variant">未找到匹配的产品</div>';
            } else {
                searchResults.innerHTML = matches.map(p => `
                    <button type="button" data-search-id="${p.id}" class="w-full flex items-center gap-2 px-4 py-2.5 text-left text-sm text-on-surface hover:bg-surface-container-low transition-colors border-b border-outline-variant/40 last:border-0">
                        <span class="material-symbols-outlined text-base text-outline-variant">local_drink</span>
                        <span class="flex-1 truncate font-medium">${p.name}</span>
                        <span class="material-symbols-outlined text-base text-outline-variant">chevron_right</span>
                    </button>
                `).join('');
            }
            searchResults.classList.remove('hidden');
        }

        searchInput.addEventListener('input', () => renderSearchResults(searchInput.value));
        searchInput.addEventListener('focus', () => { if (searchInput.value.trim()) renderSearchResults(searchInput.value); });

        searchResults.addEventListener('click', (e) => {
            const btn = e.target.closest('[data-search-id]');
            if (!btn) return;
            selectProduct(btn.getAttribute('data-search-id'));
            searchInput.value = '';
            searchResults.classList.add('hidden');
            searchResults.innerHTML = '';
        });

        document.addEventListener('click', (e) => {
            if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
                searchResults.classList.add('hidden');
            }
        });

        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                searchResults.classList.add('hidden');
                searchInput.blur();
            }
        });

        // --- Initialize ---
        window.addEventListener('load', async () => {
            await loadProducts();
            loadPackaging();
            if (productsData.length > 0) {
                activeProductId = productsData[0].id;
            }
            renderRail();
            renderOverviewTable();
            if (activeProductId) {
                selectProduct(activeProductId);
            }
        });
    </script>
</body>
</html>
