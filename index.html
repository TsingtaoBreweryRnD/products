<!DOCTYPE html>
<html class="light" lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>委托生产产品库</title>

    </script>

        body { font-family: 'Manrope', 'Noto Sans SC', sans-serif; }

<body class="bg-surface text-on-surface flex flex-col md:flex-row min-h-screen overflow-x-hidden">

    <!-- SideNavBar Shell -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-surface border-r border-outline-variant transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out flex flex-col py-8 shadow-xl md:shadow-none">

        <!-- 总览入口 -->

                <span class="text-sm font-bold flex-1 truncate">包装</span>
                <span id="packaging-overview-count" class="text-[10px] font-bold px-1.5 py-0.5 rounded-full bg-surface-container text-on-surface-variant"></span>

    </aside>

    <!-- Overlay for mobile sidebar -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/20 z-40 hidden md:hidden backdrop-blur-sm transition-opacity"></div>

    <!-- Main Content Wrapper -->
    <div class="flex-1 flex flex-col md:ml-64 min-h-screen transition-all duration-300">
        
        <!-- TopNavBar Shell -->

                    <input id="search-input" autocomplete="off" class="pl-10 pr-4 py-2 bg-surface-container-low border border-transparent rounded-full w-64 lg:w-96 text-sm focus:bg-white focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all outline-none" placeholder="搜索产品..." type="text"/>
                    <div id="search-results" class="absolute top-full left-0 right-0 mt-2 bg-white border border-outline-variant/60 rounded-xl shadow-lg hidden z-50 max-h-80 overflow-y-auto"></div>

        </header>

        <!-- Main Workspace -->
        <main class="flex-1 flex flex-col lg:flex-row overflow-hidden relative">
            
            <!-- Column 2: Details & Viewport (Center) -->
            <div class="flex-1 overflow-y-auto p-4 md:p-6 lg:p-8 bg-surface">

                <!-- ========== 主产品视图 ========== -->
                <div id="main-content-view" class="w-full flex flex-col h-full gap-6">
                    <!-- 产品信息视图 -->
                    <div id="product-view" class="flex flex-col gap-6 max-w-5xl mx-auto w-full">
                    
                    <!-- Breadcrumbs & Title -->
                    <div>
                        <nav class="flex items-center text-xs text-outline-variant mb-2 font-medium flex-wrap gap-y-1">
                            <a href="#" class="hover:text-primary transition-colors">产品列表</a>

                            <span class="text-on-surface-variant" id="breadcrumb-category"></span>

                    </div>

                    <!-- ========== 产品信息：基本信息 ========== -->

                    <!-- 基本信息 -->
                    <section class="flex flex-col gap-3">
                        <h3 class="text-sm font-extrabold text-primary flex items-center gap-2">
                            <span class="material-symbols-outlined text-base">info</span>

                        </h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div class="bg-white border border-outline-variant/60 p-4 rounded-xl shadow-sm hover:shadow-md transition-shadow">
                                <label class="text-[11px] text-outline uppercase tracking-wider font-semibold">品类</label>
                                <p class="text-sm font-bold text-on-surface mt-1" id="liquid-category"></p>
                            </div>
                            <div class="bg-white border border-outline-variant/60 p-4 rounded-xl shadow-sm hover:shadow-md transition-shadow">
                                <label class="text-[11px] text-outline uppercase tracking-wider font-semibold">品种</label>
                                <p class="text-sm font-bold text-on-surface mt-1" id="liquid-variety"></p>
                            </div>
                        </div>
                        <div class="bg-white border border-outline-variant/60 p-4 rounded-xl shadow-sm hover:shadow-md transition-shadow">

                        <div class="bg-white border border-outline-variant/60 p-4 rounded-xl shadow-sm hover:shadow-md transition-shadow">

                        </div>

                                <p class="text-sm font-bold text-on-surface mt-1" id="product-factory"></p>
                            </div>

                    <!-- 产品指标明细 -->

                            <span>产品指标明细</span>
                        </h3>
                        <p class="text-xs text-on-surface-variant" id="sku-subtitle">该产品各规格的原麦汁浓度、酒精度与保质期。</p>

                    </section>

                    <!-- 包装形式对比 -->
                    <section class="flex flex-col gap-3">
                        <h3 class="text-sm font-extrabold text-primary flex items-center gap-2">
                            <span class="material-symbols-outlined text-base">inventory_2</span>
                            <span>包装形式对比</span>
                        </h3>
                        <p class="text-xs text-on-surface-variant" id="packaging-subtitle">横向对比材质、容量、包装规格、高度与直径等参数。</p>

                    <!-- 总览视图（酒液） -->
                    <div id="overview-view" class="flex flex-col gap-6 hidden">

                            <p class="text-sm text-on-surface-variant mt-1" id="overview-subtitle">横向对比全部产品的品类、品种与指标。</p>
                        </div>
                        <div id="overview-filter" class="flex flex-col gap-3">
                            <div id="overview-category-chips" class="flex flex-wrap items-center gap-2"></div>
                            <div id="overview-variety-chips" class="flex flex-wrap items-center gap-2 hidden"></div>
                        </div>
                        <div id="overview-table-container" class="bg-white border border-outline-variant/60 rounded-xl shadow-sm overflow-hidden"></div>
                    </div>

                    <!-- 总览视图（包装） -->
                    <div id="packaging-overview-view" class="flex flex-col gap-6 hidden">
                        <div>
                            <h2 class="text-2xl md:text-3xl font-bold text-on-surface">包装</h2>
                            <p class="text-sm text-on-surface-variant mt-1" id="packaging-overview-subtitle">横向对比全部包装形式的材质、容量、规格与尺寸。</p>
                        </div>

                    </div>

                </div>

    <!-- 包装信息悬浮提示 -->
    <div id="packaging-tooltip" class="fixed z-50 hidden pointer-events-none max-w-[88vw]">
        <div class="rounded-xl border border-outline-variant/60 bg-surface-container-low/80 backdrop-blur-md shadow-2xl px-4 py-3">
            <div class="flex items-center gap-2 mb-2">
                <span class="material-symbols-outlined text-base text-primary">inventory_2</span>
                <span class="text-sm font-extrabold text-on-surface">对应包装</span>
            </div>
            <div id="packaging-tooltip-body"></div>
        </div>

    <script>
        // --- Product data loaded from JSON ---
        let productsData = [];
        let packagingData = [];
        let overviewCategory = null;
        let overviewVariety = null;

        // --- 将 products_all.json 的嵌套结构展开为扁平产品列表 ---
        function flattenProducts(raw) {
            const list = [];
            const root = (raw && raw['产品库']) ? raw['产品库'] : (raw || {});
            Object.keys(root).forEach(category => {
                const varieties = root[category] || {};
                Object.keys(varieties).forEach(variety => {
                    const products = varieties[variety] || {};
                    Object.keys(products).forEach(name => {
                        const f = products[name] || {};
                        list.push({
                            id: category + '/' + variety + '/' + name,
                            category: category,
                            variety: variety,
                            name: name,
                            claim: f['对应市售产品品类'] || '—',
                            process: f['工艺特点'] || '—',
                            flavor: f['风味特点'] || '—',
                            packaging: f['包装形式'] || '—',
                            factory: f['生产工厂'] || '',
                            sc: f['SC证'] || '',
                            skus: Array.isArray(f['产品列表']) ? f['产品列表'] : []
                        });
                    });
                });
            });
            return list;
        }

        // --- Update Main View ---
        function selectProduct(id) {
            const prod = productsData.find(p => p.id === id);
            if(!prod) return;

            // 切回产品详情视图（若当前在总览视图）
            showProductView();

            // Update breadcrumb & title
            document.getElementById('breadcrumb-category').textContent = prod.category;
            document.getElementById('breadcrumb-variety').textContent = prod.variety;
            document.getElementById('display-name').textContent = prod.name;

            // 基本信息
            document.getElementById('liquid-category').textContent = prod.category;
            document.getElementById('liquid-variety').textContent = prod.variety;
            document.getElementById('product-claim').textContent = prod.claim;
            document.getElementById('product-process').textContent = prod.process;
            document.getElementById('product-flavor').textContent = prod.flavor;
            document.getElementById('product-packaging').textContent = prod.packaging;

            // 生产工厂 / SC证（有值才显示）
            const fsRow = document.getElementById('factory-sc-row');
            const hasFactory = prod.factory && prod.factory.trim() !== '';
            const hasSc = prod.sc && prod.sc.trim() !== '';
            if (hasFactory || hasSc) {
                fsRow.classList.remove('hidden');
                document.getElementById('product-factory').textContent = hasFactory ? prod.factory : '—';
                document.getElementById('product-sc').textContent = hasSc ? prod.sc : '—';
            } else {
                fsRow.classList.add('hidden');
            }

            // 产品指标明细（产品列表）
            renderSkuTable(prod);
        }

        function renderSkuTable(prod) {
            const container = document.getElementById('sku-table-container');
            const subtitle = document.getElementById('sku-subtitle');
            if (!container) return;
            const skus = prod.skus || [];
            if (subtitle) subtitle.textContent = '共 ' + skus.length + ' 个规格，列出原麦汁浓度、酒精度与保质期。';
            if (!skus.length) {
                container.innerHTML = '<p class="p-6 text-sm text-on-surface-variant">暂无规格数据</p>';
                return;
            }
            const thead = ['序号', '原麦汁浓度', '酒精度', '保质期'].map(l =>
                '<th class="px-4 py-3 text-left text-[11px] font-extrabold text-on-surface-variant uppercase tracking-wider bg-surface-container-low border-b border-outline-variant/60 whitespace-nowrap">' + l + '</th>'
            ).join('');
            const tbody = skus.map(s => {
                const no = (s['序号'] === undefined || s['序号'] === null) ? '—' : s['序号'];
                const wort = s['原麦汁浓度'] || '—';
                const abv = s['酒精度'] || '—';
                const shelf = (s['保质期'] || '—').replace(/\s+/g, ' ');
                return '<tr class="border-b border-outline-variant/40 last:border-0 hover:bg-surface-container-low/50 transition-colors align-top">' +
                    '<td class="px-4 py-3 whitespace-nowrap text-on-surface-variant font-semibold">' + no + '</td>' +
                    '<td class="px-4 py-3 whitespace-nowrap text-on-surface font-semibold">' + wort + '</td>' +
                    '<td class="px-4 py-3 whitespace-nowrap text-on-surface font-semibold">' + abv + '</td>' +
                    '<td class="px-4 py-3 text-on-surface leading-relaxed min-w-[260px]">' + shelf + '</td>' +
                '</tr>';
            }).join('');
            container.innerHTML = '<div class="overflow-x-auto"><table class="w-full text-sm border-collapse"><thead><tr>' + thead + '</tr></thead><tbody>' + tbody + '</tbody></table></div>';
        }

        // --- 总览视图 ---
        const BEER_CATEGORY_COLORS = {
            '拉格': '#166c42',
            '艾尔': '#0c5fae',
            '特种啤酒': '#8b5000'
        };

        function beerCategoryColor(cat) {
            return BEER_CATEGORY_COLORS[cat] || '#5f6368';
        }

        const productView = document.getElementById('product-view');
        const overviewView = document.getElementById('overview-view');
        const overviewBtn = document.getElementById('overview-btn');
        const overviewCount = document.getElementById('overview-count');
        const packagingOverviewView = document.getElementById('packaging-overview-view');
        const packagingOverviewBtn = document.getElementById('packaging-overview-btn');

        function setNavActive(activeBtn) {
            [overviewBtn, packagingOverviewBtn].forEach(b => {
                if (b === activeBtn) {
                    b.classList.add('bg-primary/10', 'text-primary');
                    b.classList.remove('text-on-surface-variant');
                } else {
                    b.classList.remove('bg-primary/10', 'text-primary');
                    b.classList.add('text-on-surface-variant');
                }
            });
        }

        function showOnly(view) {
            [productView, overviewView, packagingOverviewView].forEach(v => {
                if (v === view) v.classList.remove('hidden');
                else v.classList.add('hidden');
            });
        }

        function showOverview() {
            showOnly(overviewView);
            setNavActive(overviewBtn);
        }

        function showPackagingOverview() {
            showOnly(packagingOverviewView);
            setNavActive(packagingOverviewBtn);
        }

        function showProductView() {
            showOnly(productView);
            setNavActive(null);
        }

        overviewBtn.addEventListener('click', showOverview);
        packagingOverviewBtn.addEventListener('click', showPackagingOverview);

        // 把用空格分隔的多段文字拆成多行（包装形式、风味特点等）
        function breakBySpace(s) {
            const t = (s || '—').trim();
            return t ? t.split(/\s+/).filter(Boolean).join('\n') : t;
        }

        // 保质期拆行：「熟啤酒：瓶装X天、听装X天、… 生啤酒：瓶装X天、…」→ 每种包装单独一行，啤酒类型加粗
        function shelfToLines(s) {
            const v = (s || '—').replace(/\s+/g, ' ').trim();
            if (!v || v === '—') return v;
            return v.split(' ').filter(Boolean).map(seg => {
                const idx = seg.indexOf('：');
                if (idx === -1) return seg;
                const label = seg.slice(0, idx);
                const items = seg.slice(idx + 1).split(/[、,，]/).map(x => x.trim()).filter(Boolean);
                if (!items.length) return seg;
                return items.map((it, i) => (i === 0 ? '<b>' + label + '</b>：' + it : it)).join('\n');
            }).join('\n');
        }

        // --- 酒液总览：品类/品种筛选 ---
        function filteredProducts() {
            return productsData.filter(p => {
                if (overviewCategory && p.category !== overviewCategory) return false;
                if (overviewVariety && p.variety !== overviewVariety) return false;
                return true;
            });
        }

        function filterChipClass(active) {
            return active
                ? 'px-3 py-1.5 rounded-full text-xs font-semibold border transition-colors bg-primary text-white border-primary'
                : 'px-3 py-1.5 rounded-full text-xs font-semibold border transition-colors border-outline-variant/50 text-on-surface-variant hover:bg-surface-container-low';
        }

        function renderFilterChips() {
            const catEl = document.getElementById('overview-category-chips');
            const varEl = document.getElementById('overview-variety-chips');
            const cats = [...new Set(productsData.map(p => p.category))];
            let catHtml = '<button type="button" data-filter-cat="all" class="' + filterChipClass(!overviewCategory) + '">全部</button>';
            cats.forEach(c => {
                catHtml += '<button type="button" data-filter-cat="' + c + '" class="' + filterChipClass(overviewCategory === c) + '">' + c + '</button>';
            });
            catEl.innerHTML = catHtml;
            if (overviewCategory) {
                const varieties = [...new Set(productsData.filter(p => p.category === overviewCategory).map(p => p.variety))];
                let varHtml = '<button type="button" data-filter-var="all" class="' + filterChipClass(!overviewVariety) + '">全部</button>';
                varieties.forEach(v => {
                    varHtml += '<button type="button" data-filter-var="' + v + '" class="' + filterChipClass(overviewVariety === v) + '">' + v + '</button>';
                });
                varEl.innerHTML = varHtml;
                varEl.classList.remove('hidden');
            } else {
                varEl.innerHTML = '';
                varEl.classList.add('hidden');
            }
        }

        document.getElementById('overview-category-chips').addEventListener('click', (e) => {
            const btn = e.target.closest('[data-filter-cat]');
            if (!btn) return;
            const cat = btn.getAttribute('data-filter-cat');
            overviewCategory = (cat === 'all') ? null : cat;
            overviewVariety = null;
            renderFilterChips();
            renderOverviewTable();
        });

        document.getElementById('overview-variety-chips').addEventListener('click', (e) => {
            const btn = e.target.closest('[data-filter-var]');
            if (!btn) return;
            const v = btn.getAttribute('data-filter-var');
            overviewVariety = (v === 'all') ? null : v;
            renderFilterChips();
            renderOverviewTable();
        });

        function renderOverviewTable() {
            const container = document.getElementById('overview-table-container');
            if (!container) return;
            const subtitle = document.getElementById('overview-subtitle');
            const list = filteredProducts();
            const totalSkus = list.reduce((n, p) => n + ((p.skus && p.skus.length) ? p.skus.length : 0), 0);
            if (subtitle) subtitle.textContent = '共 ' + list.length + ' 个产品 · ' + totalSkus + ' 个规格';
            if (overviewCount) overviewCount.textContent = productsData.length;
            if (!list.length) {
                container.innerHTML = '<p class="p-6 text-sm text-on-surface-variant">该分类下暂无产品</p>';
                return;
            }
            const COLS = [
                { label: '品类', w: '7%' },
                { label: '品种', w: '8%' },
                { label: '产品名称', w: '8%' },
                { label: '对应市售产品品类', w: '7%' },
                { label: '工艺特点', w: '9%' },
                { label: '风味特点', w: '9%' },
                { label: '包装形式', w: '13%' },
                { label: '生产工厂', w: '6%' },
                { label: 'SC证', w: '7%' },
                { label: '原麦汁浓度', w: '6%' },
                { label: '酒精度', w: '9%' },
                { label: '保质期', w: '11%' }
            ];
            const colgroup = '<colgroup>' + COLS.map(c => '<col style="width:' + c.w + '">').join('') + '</colgroup>';
            const thead = COLS.map(l =>
                '<th class="px-2.5 py-3 text-left text-[11px] font-extrabold text-on-surface-variant uppercase tracking-wider bg-surface-container-low border-b border-outline-variant/60 leading-snug align-middle">' + l.label + '</th>'
            ).join('');

            let tbody = '';
            list.forEach(p => {
                const skus = (p.skus && p.skus.length) ? p.skus : [{}];
                const color = beerCategoryColor(p.category);
                const rowCount = skus.length;
                const shelfValues = skus.map(s => (s['保质期'] || '—').replace(/\s+/g, ' '));
                const shelfSame = rowCount > 1 && shelfValues.every(v => v === shelfValues[0]);
                skus.forEach((s, i) => {
                    let cells = '';
                    if (i === 0) {
                        cells += '<td rowspan="' + rowCount + '" class="px-2.5 py-3 align-middle bg-surface-container-low/40 border-r border-outline-variant/40"><span class="inline-flex items-center gap-1.5"><span class="w-2 h-2 rounded-full flex-shrink-0" style="background-color:' + color + '"></span><span class="font-bold text-on-surface leading-snug">' + p.category + '</span></span></td>';
                        cells += '<td rowspan="' + rowCount + '" class="px-2.5 py-3 align-middle bg-surface-container-low/40 border-r border-outline-variant/40 text-on-surface-variant font-semibold leading-snug">' + p.variety + '</td>';
                        cells += '<td rowspan="' + rowCount + '" class="px-2.5 py-3 align-middle bg-surface-container-low/40 border-r border-outline-variant/40"><button type="button" data-overview-product-id="' + p.id + '" class="font-bold text-primary hover:underline text-left leading-snug">' + p.name + '</button></td>';
                        cells += '<td rowspan="' + rowCount + '" class="px-2.5 py-3 align-middle bg-surface-container-low/40 border-r border-outline-variant/40 text-on-surface leading-relaxed break-words">' + p.claim + '</td>';
                        cells += '<td rowspan="' + rowCount + '" class="px-2.5 py-3 align-middle bg-surface-container-low/40 border-r border-outline-variant/40 text-on-surface leading-relaxed break-words">' + p.process + '</td>';
                        cells += '<td rowspan="' + rowCount + '" class="px-2.5 py-3 align-middle bg-surface-container-low/40 border-r border-outline-variant/40 text-on-surface leading-relaxed whitespace-pre-line break-words">' + breakBySpace(p.flavor) + '</td>';
                        cells += '<td rowspan="' + rowCount + '" class="js-packaging-cell px-2.5 py-3 align-middle bg-surface-container-low/40 border-r border-outline-variant/40 text-on-surface leading-relaxed whitespace-pre-line break-words cursor-help">' + breakBySpace(p.packaging) + '</td>';
                        cells += '<td rowspan="' + rowCount + '" class="px-2.5 py-3 align-middle bg-surface-container-low/40 border-r border-outline-variant/40 text-on-surface-variant leading-snug break-words">' + (p.factory || '—') + '</td>';
                        cells += '<td rowspan="' + rowCount + '" class="px-2.5 py-3 align-middle bg-surface-container-low/40 border-r border-outline-variant/40 text-on-surface-variant leading-snug break-all">' + (p.sc || '—') + '</td>';
                    }
                    cells += '<td class="px-2.5 py-3 whitespace-nowrap align-middle border-r border-outline-variant/40 text-on-surface font-semibold">' + (s['原麦汁浓度'] || '—') + '</td>';
                    cells += '<td class="px-2.5 py-3 whitespace-nowrap align-middle border-r border-outline-variant/40 text-on-surface font-semibold">' + (s['酒精度'] || '—') + '</td>';
                    if (shelfSame) {
                        if (i === 0) {
                            cells += '<td rowspan="' + rowCount + '" class="px-2.5 py-3 text-on-surface leading-relaxed whitespace-pre-line break-words align-middle">' + shelfToLines(shelfValues[0]) + '</td>';
                        }
                    } else {
                        cells += '<td class="px-2.5 py-3 text-on-surface leading-relaxed whitespace-pre-line break-words align-middle">' + shelfToLines(shelfValues[i]) + '</td>';
                    }
                    tbody += '<tr class="border-b border-outline-variant/40 last:border-0 hover:bg-surface-container-low/50 transition-colors align-middle">' + cells + '</tr>';
                });
            });

            container.innerHTML = '<table class="w-full text-sm border-collapse table-fixed">' + colgroup + '<thead><tr>' + thead + '</tr></thead><tbody>' + tbody + '</tbody></table>';
        }

        document.getElementById('overview-table-container').addEventListener('click', (e) => {
            const btn = e.target.closest('[data-overview-product-id]');
            if (btn) selectProduct(btn.getAttribute('data-overview-product-id'));
        });

        // --- Mobile Sidebar Logic ---
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        const openBtn = document.getElementById('open-sidebar');
        const closeBtn = document.getElementById('close-sidebar');

        function toggleMenu() {
            const isClosed = sidebar.classList.contains('-translate-x-full');
            if (isClosed) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                document.body.style.overflow = 'hidden'; // Prevent background scrolling
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
                document.body.style.overflow = '';
            }
        }

        openBtn.addEventListener('click', toggleMenu);
        closeBtn.addEventListener('click', toggleMenu);
        overlay.addEventListener('click', toggleMenu);

        // --- Load products from JSON ---
        async function loadProducts() {
            try {
                const response = await fetch('products_all.json', { cache: 'no-store' });
                if (!response.ok) throw new Error('Failed to load products_all.json');
                productsData = flattenProducts(await response.json());
            } catch (err) {
                console.warn('products_all.json 加载失败:', err);
                productsData = [];
            }
        }

        // --- 包装形式对比：数据与渲染 ---
        const CATEGORY_COLORS = {
            '易拉罐': '#0c5fae',
            '马口铁桶': '#8b5000',
            '玻璃瓶': '#166c42',
            '不锈钢桶': '#455a64',
            'PET桶': '#006a60'
        };

        function categoryColor(cat) {
            return CATEGORY_COLORS[cat] || '#5f6368';
        }

        function formatVolume(v) {
            if (typeof v === 'number') return v + ' mL';
            const s = String(v);
            return /^\d+$/.test(s) ? s + ' mL' : s;
        }

        function formatPackSpec(v) {
            return String(v).replace(/\*/g, '×');
        }

        function dimText(v) {
            return (v === null || v === undefined || v === '') ? '—' : v + ' mm';
        }

        async function loadPackaging() {
            try {
                const res = await fetch('packaging.json', { cache: 'no-store' });
                if (!res.ok) throw new Error('Failed to load packaging.json');
                // 包装图片按 packaging.json 数组顺序一一对应：第 N 条 → package_N.png
                packagingData = (await res.json()).map((p, i) => ({ ...p, 图片: `package_${i + 1}.png` }));
            } catch (err) {
                console.warn('包装数据加载失败:', err);
                packagingData = [];
            }
            renderPackagingTable();
        }

        function renderPackagingTable() {
            const container = document.getElementById('packaging-table-container');
            const overviewContainer = document.getElementById('packaging-overview-container');
            const subtitle = document.getElementById('packaging-subtitle');
            const overviewSubtitle = document.getElementById('packaging-overview-subtitle');
            const packagingCount = document.getElementById('packaging-overview-count');
            const totalText = '共 ' + packagingData.length + ' 种包装形式，横向对比材质、容量、包装规格、高度与直径等参数。';
            if (subtitle) subtitle.textContent = totalText;
            if (overviewSubtitle) overviewSubtitle.textContent = totalText;
            if (packagingCount) packagingCount.textContent = packagingData.length;
            if (!packagingData.length) {
                const empty = '<p class="p-6 text-sm text-on-surface-variant">暂无包装数据</p>';
                if (container) container.innerHTML = empty;
                if (overviewContainer) overviewContainer.innerHTML = empty;
                return;
            }
            const HEADERS = ['分类', '规格', '材质', '包装规格', '高度 (mm)', '直径 (mm)', '图示', '备注'];
            const thead = HEADERS.map(l =>
                '<th class="px-4 py-3 text-left text-[11px] font-extrabold text-on-surface-variant uppercase tracking-wider bg-surface-container-low border-b border-outline-variant/60 whitespace-nowrap">' + l + '</th>'
            ).join('');

            const tbody = packagingData.map((p, i) => {
                const cat = p['分类'] || '—';
                const dim = p['参数_mm'] || {};
                const color = categoryColor(cat);
                const img = 'package_' + (i + 1) + '.png';
                const note = (dim['备注'] === undefined || dim['备注'] === null || dim['备注'] === '') ? '—' : dim['备注'];

                const cells = [
                    '<td class="px-4 py-3 whitespace-nowrap"><span class="inline-flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full flex-shrink-0" style="background-color:' + color + '"></span><span class="font-bold text-on-surface">' + cat + '</span></span></td>',
                    '<td class="px-4 py-3 whitespace-nowrap text-on-surface font-semibold">' + formatVolume(p['规格_ml']) + '</td>',
                    '<td class="px-4 py-3 whitespace-nowrap"><span class="inline-flex items-center px-2.5 py-0.5 rounded-md text-xs font-semibold bg-surface-container text-on-surface-variant">' + (p['材质'] || '—') + '</span></td>',
                    '<td class="px-4 py-3 whitespace-nowrap text-on-surface">' + formatPackSpec(p['包装规格']) + '</td>',
                    '<td class="px-4 py-3 whitespace-nowrap text-on-surface">' + dimText(dim['高度']) + '</td>',
                    '<td class="px-4 py-3 whitespace-nowrap text-on-surface">' + dimText(dim['直径']) + '</td>',
                    '<td class="px-3 py-2"><div class="h-16 w-20 flex items-center justify-center rounded-lg border border-outline-variant/40 bg-white overflow-hidden"><img src="' + img + '" alt="' + cat + '" loading="lazy" class="h-14 w-auto max-w-full object-contain" onerror="this.style.opacity=0"></div></td>',
                    '<td class="px-4 py-3 whitespace-nowrap text-on-surface-variant">' + note + '</td>'
                ].join('');

                return '<tr class="border-b border-outline-variant/40 last:border-0 hover:bg-surface-container-low/50 transition-colors">' + cells + '</tr>';
            }).join('');

            const tableHtml = '<div class="overflow-x-auto"><table class="w-full text-sm border-collapse"><thead><tr>' + thead + '</tr></thead><tbody>' + tbody + '</tbody></table></div>';
            if (container) container.innerHTML = tableHtml;
            if (overviewContainer) overviewContainer.innerHTML = tableHtml;
        }

        // --- 包装形式悬浮提示 ---
        const packagingTooltip = document.getElementById('packaging-tooltip');
        const packagingTooltipBody = document.getElementById('packaging-tooltip-body');

        // 单元格里包装标签（瓶/听/…）→ packaging.json 的「分类」
        const PACKAGING_LABEL_TO_CATEGORY = {
            '瓶': '玻璃瓶',
            '听': '易拉罐',
            '马口铁桶': '马口铁桶',
            '不锈钢桶': '不锈钢桶',
            'PET桶': 'PET桶'
        };

        // 把「瓶：258ml、330ml… 听：330ml、330ml纤体罐…」解析成 [{category, tokens}]
        function parsePackagingCell(text) {
            const t = (text || '').trim();
            if (!t) return [];
            const parts = t.split(/\s+/).filter(Boolean);
            const result = [];
            for (const part of parts) {
                const idx = part.indexOf('：');
                if (idx === -1) continue;
                const cat = PACKAGING_LABEL_TO_CATEGORY[part.slice(0, idx)];
                if (!cat) continue;
                const tokens = part.slice(idx + 1).split(/[、,，]/).map(s => s.trim()).filter(Boolean);
                if (tokens.length) result.push({ category: cat, tokens });
            }
            return result;
        }

        // 统一规格写法，便于精确比对：「258ml」→「258」，「330ml纤体罐」→「330纤体」，「1L」→「1000」，「20L」→「20000」
        function normSpec(spec) {
            let s = String(spec).trim();
            s = s.replace(/ml/gi, '');
            s = s.replace(/罐/g, '');
            const lm = s.match(/^(\d+(?:\.\d+)?)[lL]$/);
            if (lm) return String(Math.round(parseFloat(lm[1]) * 1000));
            return s;
        }

        // 精确匹配：只返回该单元格里明确提到的包装
        function packagingEntriesFor(text) {
            const mentioned = parsePackagingCell(text);
            if (!mentioned.length) return [];
            return packagingData.filter(p => {
                return mentioned.some(m => {
                    if (m.category !== p['分类']) return false;
                    const key = normSpec(p['规格_ml']);
                    return m.tokens.some(tok => normSpec(tok) === key);
                });
            });
        }

        function buildPackagingTooltip(matches) {
            if (!matches.length) return '';
            const headers = ['图片', '分类', '规格', '材质', '包装规格', '高度(mm)', '直径(mm)', '备注'];
            const thead = '<tr>' + headers.map(h =>
                '<th class="px-2.5 py-1.5 text-left text-[10px] font-extrabold text-on-surface-variant uppercase tracking-wider bg-surface-container/60 border-b border-outline-variant/50 whitespace-nowrap">' + h + '</th>'
            ).join('') + '</tr>';
            const tbody = matches.map(p => {
                const dim = p['参数_mm'] || {};
                const note = (dim['备注'] === undefined || dim['备注'] === null || dim['备注'] === '') ? '—' : dim['备注'];
                const img = p['图片'] || '';
                return '<tr class="border-b border-outline-variant/40 last:border-0">' +
                    '<td class="px-2.5 py-1.5 whitespace-nowrap">' + (img ? '<img src="' + img + '" alt="' + (p['分类'] || '') + '" class="h-12 w-auto object-contain">' : '<span class="text-on-surface-variant">—</span>') + '</td>' +
                    '<td class="px-2.5 py-1.5 whitespace-nowrap font-bold text-on-surface">' + (p['分类'] || '—') + '</td>' +
                    '<td class="px-2.5 py-1.5 whitespace-nowrap text-on-surface">' + formatVolume(p['规格_ml']) + '</td>' +
                    '<td class="px-2.5 py-1.5 whitespace-nowrap text-on-surface">' + (p['材质'] || '—') + '</td>' +
                    '<td class="px-2.5 py-1.5 whitespace-nowrap text-on-surface">' + formatPackSpec(p['包装规格']) + '</td>' +
                    '<td class="px-2.5 py-1.5 whitespace-nowrap text-on-surface">' + dimText(dim['高度']) + '</td>' +
                    '<td class="px-2.5 py-1.5 whitespace-nowrap text-on-surface">' + dimText(dim['直径']) + '</td>' +
                    '<td class="px-2.5 py-1.5 whitespace-nowrap text-on-surface-variant">' + note + '</td>' +
                '</tr>';
            }).join('');
            return '<div class="overflow-x-auto"><table class="w-max text-xs border-collapse"><thead>' + thead + '</thead><tbody>' + tbody + '</tbody></table></div>';
        }

        function showPackagingTooltip(cell) {
            const matches = packagingEntriesFor(cell.textContent || '');
            const html = matches.length ? buildPackagingTooltip(matches) : '';
            if (!html) { hidePackagingTooltip(); return; }
            packagingTooltipBody.innerHTML = html;
            packagingTooltip.classList.remove('hidden');
            const rect = cell.getBoundingClientRect();
            const tw = packagingTooltip.offsetWidth;
            const th = packagingTooltip.offsetHeight;
            const gap = 12;
            let left = rect.left;
            let top = rect.bottom + gap;
            if (left + tw > window.innerWidth - 12) left = Math.max(12, window.innerWidth - tw - 12);
            if (top + th > window.innerHeight - 12) top = Math.max(12, rect.top - th - gap);
            packagingTooltip.style.left = left + 'px';
            packagingTooltip.style.top = top + 'px';
        }

        function hidePackagingTooltip() {
            packagingTooltip.classList.add('hidden');
        }

        document.getElementById('overview-table-container').addEventListener('mouseover', (e) => {
            const cell = e.target.closest('.js-packaging-cell');
            if (cell) showPackagingTooltip(cell);
        });
        document.getElementById('overview-table-container').addEventListener('mouseout', (e) => {
            if (e.target.closest('.js-packaging-cell')) hidePackagingTooltip();
        });
        window.addEventListener('scroll', hidePackagingTooltip, true);

        // --- 搜索产品 ---
        const searchInput = document.getElementById('search-input');
        const searchResults = document.getElementById('search-results');

        function renderSearchResults(query) {
            const q = query.trim().toLowerCase();
            if (!q) { searchResults.classList.add('hidden'); searchResults.innerHTML = ''; return; }
            const matches = productsData.filter(p => (p.name || '').toLowerCase().includes(q));
            if (!matches.length) {
                searchResults.innerHTML = '<div class="px-4 py-3 text-sm text-on-surface-variant">未找到匹配的产品</div>';
            } else {
                searchResults.innerHTML = matches.map(p => `
                    <button type="button" data-search-id="${p.id}" class="w-full flex items-center gap-2 px-4 py-2.5 text-left text-sm text-on-surface hover:bg-surface-container-low transition-colors border-b border-outline-variant/40 last:border-0">
                        <span class="material-symbols-outlined text-base text-outline-variant">local_drink</span>
                        <span class="flex-1 truncate font-medium">${p.name}</span>
                        <span class="material-symbols-outlined text-base text-outline-variant">chevron_right</span>
                    </button>
                `).join('');
            }
            searchResults.classList.remove('hidden');
        }

        searchInput.addEventListener('input', () => renderSearchResults(searchInput.value));
        searchInput.addEventListener('focus', () => { if (searchInput.value.trim()) renderSearchResults(searchInput.value); });

        searchResults.addEventListener('click', (e) => {
            const btn = e.target.closest('[data-search-id]');
            if (!btn) return;
            selectProduct(btn.getAttribute('data-search-id'));
            searchInput.value = '';
            searchResults.classList.add('hidden');
            searchResults.innerHTML = '';
        });

        document.addEventListener('click', (e) => {
            if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
                searchResults.classList.add('hidden');
            }
        });

        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                searchResults.classList.add('hidden');
                searchInput.blur();
            }
        });

        // --- Initialize ---
        window.addEventListener('load', async () => {
            await loadProducts();
            loadPackaging();
            renderFilterChips();
            renderOverviewTable();
            showOverview();
        });
    </script>
</body>
</html>
